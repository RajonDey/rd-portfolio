name: Desk weekly

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run desk:weekly
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DESK_MAIL_FROM: ${{ secrets.DESK_MAIL_FROM }}
          DESK_MAIL_TO: ${{ secrets.DESK_MAIL_TO }}
          DESK_GIST_ID: ${{ secrets.DESK_GIST_ID }}
          DESK_GIST_TOKEN: ${{ secrets.DESK_GIST_TOKEN }}
